name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # pdftools remains required only by legacy regression tests.
      - name: Install legacy test system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpoppler-cpp-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Run tests
        run: Rscript -e "testthat::test_dir('tests/testthat')"

      - name: Check renv consistency
        run: Rscript -e "renv::status()"

      - name: Validate application startup
        run: Rscript -e "invisible(parse(file = 'app.R')); app <- source('app.R')[['value']]; stopifnot(inherits(app, 'shiny.appobj'))"
